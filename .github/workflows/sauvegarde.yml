name: Sauvegarde quotidienne

# Sauvegarde chiffrée de la base de production, conservée 30 jours comme
# artefact GitHub. Secrets requis (Settings → Secrets → Actions) :
#   BACKUP_DATABASE_URL  URL directe Neon de la production (sans -pooler)
#   BACKUP_PASSPHRASE    phrase de passe de chiffrement (à garder hors de GitHub aussi)
on:
  schedule:
    - cron: "30 3 * * *" # 05:30 heure de Paris l'été, 04:30 l'hiver
  workflow_dispatch:

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration
        id: check
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "Secret BACKUP_DATABASE_URL absent : sauvegarde ignorée."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Installer pg_dump
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get install -y wget ca-certificates
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - name: Sauvegarder et chiffrer
        if: steps.check.outputs.skip != 'true'
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          file="nautilus-$(date +%Y%m%d-%H%M).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges --dbname="$URL" --file="$file"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 "$file"
          rm "$file"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: sauvegarde-${{ github.run_id }}
          path: "*.dump.gpg"
          retention-days: 30
